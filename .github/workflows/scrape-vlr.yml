name: VLR Schedule Scraper

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run VLR scraper
        run: node scripts/scrape.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fetched-schedule.json data/fetched-teams.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily VLR schedule + teams update [skip ci]"
            git push
          fi
