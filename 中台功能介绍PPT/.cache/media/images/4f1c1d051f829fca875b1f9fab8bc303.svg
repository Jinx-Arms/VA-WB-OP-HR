<svg width="540" height="420" viewBox="0 0 540 420" xmlns="http://www.w3.org/2000/svg"><text x="30" y="36" fill="#94A3B8" font-size="15">数据分层：静态抓取层 + 手动补充层</text><rect x="30" y="60" width="480" height="110" rx="10" fill="#16233B" stroke="#3B82F6" stroke-width="1.5" /><text x="50" y="92" fill="#22D3EE" font-size="17" font-weight="bold">静态层 · fetched-teams.json</text><text x="50" y="120" fill="#E5E9F0" font-size="14">VLR 抓取 50 队 / 462 选手（大体量，不进 state）</text><text x="50" y="144" fill="#94A3B8" font-size="13">每日定时更新，运营无需关心</text><rect x="30" y="200" width="480" height="110" rx="10" fill="#16233B" stroke="#FF4655" stroke-width="1.5" /><text x="50" y="232" fill="#FF4655" font-size="17" font-weight="bold">手动层 · App.state（Supabase 同步）</text><text x="50" y="260" fill="#E5E9F0" font-size="14">队伍覆盖 / 对阵备注 / 看点 highlight / 新建队伍</text><text x="50" y="284" fill="#94A3B8" font-size="13">manual:true 的队不被自动同步覆盖</text><rect x="30" y="340" width="480" height="60" rx="10" fill="#0B1220" stroke="#22D3EE" stroke-width="1" /><text x="50" y="376" fill="#E5E9F0" font-size="15">惰性合并：storyData() 静态为基，手动层叠加</text><line x1="270" y1="170" x2="270" y2="200" stroke="#22D3EE" stroke-width="2" /><line x1="270" y1="310" x2="270" y2="340" stroke="#22D3EE" stroke-width="2" /></svg>